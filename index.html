<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Platform Train</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #9cd3f5; font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; user-select: none; }
  canvas { display: block; }

  #bubble { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.94); border-radius: 26px;
    padding: 10px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.2);
    font-size: clamp(18px, 4vw, 28px); color: #333; max-width: calc(100vw - 120px); white-space: nowrap; }
  #bubble .num { display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; border-radius: 14px; color: #fff;
    font-size: 1.5em; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #bubble.pop { animation: pop .4s; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.12); } 100% { transform: translateX(-50%) scale(1); } }

  #stars { position: fixed; top: 16px; right: 16px; background: rgba(255,255,255,.94); border-radius: 20px; padding: 8px 14px; font-size: 22px; color: #333;
    box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  #mute { position: fixed; top: 16px; left: 16px; width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(255,255,255,.94);
    font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.12); }

  #pad { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; width: max-content; max-width: calc(100vw - 32px); }
  #pad button { width: clamp(52px, 8vw, 76px); height: clamp(52px, 8vw, 76px); border-radius: 20px; border: none; color: #fff; cursor: pointer;
    font: inherit; font-size: clamp(28px, 4.6vw, 42px); text-shadow: 0 2px 0 rgba(0,0,0,.3); box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.25);
    transition: transform .08s, box-shadow .08s, opacity .2s; }
  #pad button:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  #pad.off button { opacity: .45; pointer-events: none; }
  #pad button.shake { animation: shake .45s; }
  #pad button.hint { animation: hint 1s infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes hint { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 0 6px #fff, 0 6px 0 rgba(0,0,0,.25); } }
  @media (max-width: 600px) { #pad { max-width: 330px; } }

  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 80, 140, .4); backdrop-filter: blur(5px); z-index: 10; }
  #start .card { background: #fff; border-radius: 32px; padding: 32px 36px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.15); max-width: calc(100vw - 32px); }
  #start h1 { font-size: clamp(28px, 6vw, 44px); color: #e53935; margin-bottom: 8px; }
  #start p { font-size: 18px; color: #555; margin-bottom: 22px; line-height: 1.4; }
  #start button { font: inherit; font-size: 30px; padding: 14px 44px; border: none; border-radius: 24px; background: #43a047; color: #fff;
    cursor: pointer; box-shadow: 0 6px 0 #2e7d32; }
  #start button:active { transform: translateY(4px); box-shadow: 0 2px 0 #2e7d32; }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .55s; z-index: 5; }
  #card { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.5); font-size: clamp(34px, 7vw, 76px); color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.25), 0 8px 30px rgba(0,0,0,.35); opacity: 0; pointer-events: none; white-space: nowrap; z-index: 4;
    transition: opacity .4s, transform .6s cubic-bezier(.2, 1.6, .4, 1); }
  #card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #pad { transition: opacity .4s; }
  body.journey #pad { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="bubble">🚂 <span id="say">Get ready…</span> <span class="num" id="bnum">?</span></div>
  <div id="stars">⭐ <span id="starCount">0</span></div>
  <button id="mute" aria-label="Sound on/off">🔊</button>
  <div id="pad" class="off"></div>
  <div id="card"></div>
  <div id="fade"></div>
  <div id="start"><div class="card">
    <h1>🚂 Platform Train</h1>
    <p>Every platform has its own little train friend.<br>Listen for the number, then tap the right<br>number, train or platform sign!</p>
    <button id="play">▶ Play</button>
  </div></div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ================= layout =================
    // Trains wait by the tunnel (far, +z) and drive toward the camera (-z) into the platforms.
    const N = 9, SP = 5;
    const xOf = i => (4 - i) * SP;                 // platform 1 on the left of the screen
    const COLORS = ['#e53935', '#fb8c00', '#f2b705', '#43a047', '#00897b', '#1e88e5', '#5e35b1', '#d81b60', '#6d4c41']; // number colours
    const Z_START = 32, Z_END = -17;
    const L = Z_START - Z_END;
    const RAIL_TOP = 0.5, PLAT_H = 1.3;
    const CAR_GAP = 4.9;
    const S0 = 12, S_END = 41;                     // engine centre z = Z_START - s  (20 waiting, -9 at platform)
    const P_Z0 = 3, P_Z1 = -16;

    // ================= renderer / scene =================
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.58;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog('#cfe6f5', 120, 340);

    const sky = new Sky(); sky.scale.setScalar(4000);
    const su = sky.material.uniforms;
    su.turbidity.value = 3; su.rayleigh.value = 1.2; su.mieCoefficient.value = .003; su.mieDirectionalG.value = .8;
    const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(45), THREE.MathUtils.degToRad(200));
    su.sunPosition.value.copy(sunDir);
    const pmrem = new THREE.PMREMGenerator(renderer);
    { const env = new THREE.Scene(); env.add(sky); scene.environment = pmrem.fromScene(env, 0.03).texture; }
    scene.add(sky);

    const sun = new THREE.DirectionalLight('#fff4e2', 2.4);
    sun.position.copy(sunDir).multiplyScalar(90);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 220 });
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight('#dff0ff', '#6b8f3a', 0.35));

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 5000);
    const camBase = new THREE.Vector3(0, 0, 11);
    const camLook = camBase.clone(), camGoal = camBase.clone();
    const camDirBase = new THREE.Vector3(0, .55, -.83).normalize();
    const camDirFollow = new THREE.Vector3(0, .38, -.92).normalize();
    const camDir = camDirBase.clone(), camDirGoal = new THREE.Vector3();
    let camDist = 58;
    function fitCamera() {
      const a = innerWidth / innerHeight;
      camera.aspect = a;
      const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      camDist = Math.max(46, 25 / (t * a));
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    fitCamera();
    addEventListener('resize', fitCamera);

    // ================= helpers =================
    const rnd = (a, b) => a + Math.random() * (b - a);
    const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .7, ...o });
    const toy = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: .38, metalness: 0, clearcoat: .7, clearcoatRoughness: .25, ...o });
    function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
      parent.add(m); return m;
    }
    function canvasTex(w, h, draw, rx = 1, ry = 1) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
      return t;
    }
    function speckle(ctx, w, h, base, cols, count, maxSize) {
      ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
      for (let k = 0; k < count; k++) {
        ctx.fillStyle = cols[k % cols.length]; ctx.globalAlpha = rnd(.25, .8);
        const s = rnd(1, maxSize); ctx.fillRect(rnd(0, w), rnd(0, h), s, s * rnd(.6, 1.4));
      }
      ctx.globalAlpha = 1;
    }
    function drawNumber(ctx, w, h, n, color) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(16, 16, w - 32, h - 32, 40); ctx.fill();
      ctx.font = `bold ${h * .72}px "Arial Rounded MT Bold", Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.strokeText(n, w / 2, h / 2 + 8);
      ctx.fillStyle = '#fff'; ctx.fillText(n, w / 2, h / 2 + 8);
    }

    // ================= ground & scenery =================
    const grassTex = canvasTex(512, 512, (c, w, h) => speckle(c, w, h, '#6fae3c', ['#82c24b', '#5f9c32', '#93cf5a', '#5a9430'], 12000, 4), 110, 110);
    const gravelTex = canvasTex(256, 256, (c, w, h) => speckle(c, w, h, '#a39a8e', ['#8a8277', '#bdb5a9', '#968a7c', '#cfc8bd'], 5000, 5), .9, .9);
    const ground = mesh(new THREE.PlaneGeometry(700, 700), std('#ffffff', { map: grassTex, roughness: 1 }), 0, 0, 0, scene, false);
    ground.rotation.x = -Math.PI / 2;

    // tunnel hill at the far end
    const hillMat = std('#5fa23a', { roughness: .95 });
    const hill = mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), hillMat, 0, 0, 44);
    hill.scale.set(42, 15, 12);
    for (let k = 0; k < 6; k++) {
      const h2 = mesh(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), std(k % 2 ? '#6db544' : '#58983a', { roughness: .95 }), rnd(-70, 70), 0, rnd(60, 110));
      h2.scale.set(rnd(25, 45), rnd(14, 26), rnd(15, 25));
    }
    const archShape = new THREE.Shape();
    archShape.moveTo(-1.7, 0); archShape.lineTo(-1.7, 2.6); archShape.absarc(0, 2.6, 1.7, Math.PI, 0, true); archShape.lineTo(1.7, 0); archShape.lineTo(-1.7, 0);
    const stoneShape = new THREE.Shape();
    stoneShape.moveTo(-2.3, 0); stoneShape.lineTo(-2.3, 2.6); stoneShape.absarc(0, 2.6, 2.3, Math.PI, 0, true); stoneShape.lineTo(2.3, 0); stoneShape.lineTo(-2.3, 0);
    stoneShape.holes.push(archShape);
    const stoneGeo = new THREE.ExtrudeGeometry(stoneShape, { depth: 1.2, bevelEnabled: true, bevelSize: .12, bevelThickness: .12, bevelSegments: 3 });
    const darkGeo = new THREE.ShapeGeometry(archShape);
    for (let i = 0; i < N; i++) {
      mesh(stoneGeo, std('#b9a58a', { roughness: .9 }), xOf(i), 0, Z_START + .2);
      mesh(darkGeo, new THREE.MeshBasicMaterial({ color: '#141414' }), xOf(i), 0, Z_START + .9, scene, false);
    }
    mesh(new THREE.BoxGeometry(N * SP + 2, 5.2, 1.6), std('#5fa23a', { roughness: .95 }), 0, 2.6, Z_START + 2.2, scene, false);

    // trees
    const trunkMat = std('#7a5236'), leafMats = ['#4caf50', '#66bb6a', '#43a047', '#7cb342'].map(c => toy(c, { roughness: .6, clearcoat: .2 }));
    const leafGeo = new THREE.SphereGeometry(1, 20, 14), trunkGeo = new THREE.CylinderGeometry(.22, .3, 1, 10);
    for (let k = 0; k < 90; k++) {
      let x, z;
      do { x = rnd(-90, 90); z = rnd(-60, 80); } while (Math.abs(x) < 30 && z > -28 && z < 58);
      const t = new THREE.Group(); t.position.set(x, 0, z); scene.add(t);
      t.scale.setScalar(rnd(1, 1.8));
      mesh(trunkGeo, trunkMat, 0, 1, 0, t).scale.y = 2;
      mesh(leafGeo, leafMats[k % 4], 0, 3, 0, t).scale.set(1.5, 1.4, 1.5);
      mesh(leafGeo, leafMats[(k + 1) % 4], .6, 3.7, .2, t).scale.setScalar(1);
    }
    // puffy clouds
    const cloudMat = std('#ffffff', { roughness: 1, emissive: '#ffffff', emissiveIntensity: .15 });
    const clouds = [];
    for (let k = 0; k < 9; k++) {
      const c = new THREE.Group(); c.position.set(rnd(-90, 90), rnd(26, 38), rnd(60, 140)); scene.add(c);
      for (let q = 0; q < 5; q++) mesh(leafGeo, cloudMat, q * 2.6 - 5, rnd(0, 1.2), rnd(-1, 1), c, false).scale.setScalar(rnd(2.2, 3.4));
      clouds.push(c);
    }
    // flowers
    const flowerCols = ['#ff5a8a', '#ffd23f', '#ffffff', '#b388ff', '#ff7043'].map(c => std(c, { roughness: .6 }));
    const fGeo = new THREE.SphereGeometry(.22, 8, 6);
    for (let k = 0; k < 160; k++) {
      let x, z;
      do { x = rnd(-60, 60); z = rnd(-30, 40); } while (Math.abs(x) < 25);
      mesh(fGeo, flowerCols[k % 5], x, .2, z, scene, false);
    }

    // ================= tracks =================
    const ballastShape = new THREE.Shape([new THREE.Vector2(-1.7, 0), new THREE.Vector2(1.7, 0), new THREE.Vector2(1.3, .22), new THREE.Vector2(-1.3, .22)]);
    const ballastGeo = new THREE.ExtrudeGeometry(ballastShape, { depth: L, bevelEnabled: false });
    const ballastMat = std('#ffffff', { map: gravelTex, roughness: 1 });
    const railMat = std('#9aa3ab', { metalness: .8, roughness: .3 });
    const goldMat = std('#ffd54f', { metalness: .4, roughness: .25, emissive: '#ffb300', emissiveIntensity: 1 });
    const railGeo = new THREE.BoxGeometry(.12, .16, L);
    const sleeperGap = .7, perTrack = Math.floor(L / sleeperGap);
    const sleepers = new THREE.InstancedMesh(new RoundedBoxGeometry(2.4, .14, .32, 2, .05), std('#9b6b45', { roughness: .85 }), perTrack * N);
    const dm = new THREE.Object3D();
    const rails = [];
    for (let i = 0; i < N; i++) {
      const x = xOf(i), zMid = (Z_START + Z_END) / 2;
      mesh(ballastGeo, ballastMat, x, 0, Z_END, scene, false);
      rails.push([-.6, .6].map(o => mesh(railGeo, railMat, x + o, RAIL_TOP - .08, zMid)));
      for (let k = 0; k < perTrack; k++) {
        dm.position.set(x, .29, Z_START - .3 - k * sleeperGap); dm.updateMatrix(); sleepers.setMatrixAt(i * perTrack + k, dm.matrix);
      }
      const b = new THREE.Group(); b.position.set(x, RAIL_TOP, Z_END + .3); scene.add(b);
      mesh(new RoundedBoxGeometry(2.2, .9, .6, 2, .15), toy('#e53935'), 0, .5, 0, b);
      mesh(new RoundedBoxGeometry(2.3, .3, .7, 2, .1), toy('#ffd600'), 0, 1.05, 0, b);
    }
    sleepers.receiveShadow = true; scene.add(sleepers);
    const highlight = (i, on) => rails[i].forEach(r => r.material = on ? goldMat : railMat);

    // signals (face the camera)
    const signals = [];
    for (let i = 0; i < N; i++) {
      const g = new THREE.Group(); g.position.set(xOf(i) + 1.75, 0, 15.5); scene.add(g);
      mesh(new THREE.CylinderGeometry(.1, .12, 3.6, 10), toy('#eeeeee'), 0, 1.8, 0, g);
      mesh(new RoundedBoxGeometry(.6, 1.2, .4, 3, .2), toy('#263238'), 0, 3.9, 0, g);
      const red = mesh(new THREE.SphereGeometry(.18, 16, 10), std('#ff2a1a', { emissive: '#ff2a1a', emissiveIntensity: 2.5 }), 0, 4.2, -.2, g, false);
      const green = mesh(new THREE.SphereGeometry(.18, 16, 10), std('#1d3b22', { emissive: '#22ff66', emissiveIntensity: 0 }), 0, 3.65, -.2, g, false);
      signals.push({ red, green });
    }
    function setSignal(i, go) {
      const s = signals[i];
      s.red.material.emissiveIntensity = go ? 0 : 2.5; s.red.material.color.set(go ? '#3b1a17' : '#ff2a1a');
      s.green.material.emissiveIntensity = go ? 2.5 : 0; s.green.material.color.set(go ? '#22ff66' : '#1d3b22');
    }

    // ================= platforms & number boards =================
    const platMat = toy('#f3ead8', { clearcoat: 0, roughness: .8 });
    const edgeMat = toy('#ffcf33', { clearcoat: 0 });
    const P_LEN = P_Z0 - P_Z1, P_MID = (P_Z0 + P_Z1) / 2;
    const lampGeo = new THREE.CylinderGeometry(.08, .1, 3.2, 10), lampHead = new THREE.SphereGeometry(.32, 16, 12);
    const benchMat = toy('#4fc3f7'), lampMat = toy('#3f51b5'), bulbMat = std('#fff8e1', { emissive: '#ffe082', emissiveIntensity: 1 });
    const potMat = toy('#e57373'), bushMat = toy('#43a047', { clearcoat: .2 });
    for (let j = 0; j <= N; j++) {
      const left = j === 0 ? xOf(0) + 6 : xOf(j - 1) - 1.3, right = j === N ? xOf(N - 1) - 6 : xOf(j) + 1.3;
      const w = Math.abs(left - right), cx = (left + right) / 2;
      mesh(new RoundedBoxGeometry(w, PLAT_H, P_LEN, 2, .12), platMat, cx, PLAT_H / 2, P_MID);
      if (j > 0) mesh(new THREE.BoxGeometry(.35, .03, P_LEN - .3), edgeMat, left - .3, PLAT_H + .01, P_MID, scene, false);
      if (j < N) mesh(new THREE.BoxGeometry(.35, .03, P_LEN - .3), edgeMat, right + .3, PLAT_H + .01, P_MID, scene, false);
      for (const z of [-1, -9]) {
        mesh(lampGeo, lampMat, cx, PLAT_H + 1.6, z);
        mesh(lampHead, bulbMat, cx, PLAT_H + 3.3, z, scene, false);
      }
      if (w > 1.8) {
        mesh(new RoundedBoxGeometry(.6, .18, 1.8, 2, .06), benchMat, cx, PLAT_H + .5, -5);
        mesh(new RoundedBoxGeometry(.12, .6, 1.8, 2, .05), benchMat, cx + (j < 5 ? .3 : -.3), PLAT_H + .85, -5);
        mesh(new THREE.CylinderGeometry(.35, .28, .55, 14), potMat, cx, PLAT_H + .28, -13);
        mesh(leafGeo, bushMat, cx, PLAT_H + .85, -13).scale.setScalar(.5);
      }
    }
    const boards = [];
    const GANTRY_Z = P_Z0 + 1.5, BOARD_Y = 7.4;
    const gantryMat = toy('#3f51b5');
    mesh(new RoundedBoxGeometry(N * SP + 4, .4, .4, 2, .12), gantryMat, 0, BOARD_Y + 1.15, GANTRY_Z);
    for (const x of [xOf(0) + 3.6, xOf(N - 1) - 3.6]) mesh(new THREE.CylinderGeometry(.22, .25, BOARD_Y + 1.2, 12), gantryMat, x, (BOARD_Y + 1.2) / 2, GANTRY_Z);
    const boardBack = toy('#ffffff');
    for (let i = 0; i < N; i++) {
      const tex = canvasTex(256, 256, (c, w, h) => drawNumber(c, w, h, i + 1, COLORS[i]));
      const face = new THREE.MeshStandardMaterial({ map: tex, roughness: .5, emissive: '#ffffff', emissiveMap: tex, emissiveIntensity: .3 });
      // face index 5 = -z side, toward the camera
      const b = mesh(new THREE.BoxGeometry(3.2, 3.2, .2), [boardBack, boardBack, boardBack, boardBack, boardBack, face], xOf(i), BOARD_Y - .75, GANTRY_Z);
      b.userData.idx = i; boards.push(b);
    }

    // little station house on the side
    {
      const g = new THREE.Group(); g.position.set(xOf(0) + 15, 0, -6); g.rotation.y = Math.PI + .5; scene.add(g);
      mesh(new RoundedBoxGeometry(10, 5, 6, 3, .3), toy('#fff3e0', { clearcoat: .2 }), 0, 2.5, 0, g);
      const roof = mesh(new THREE.ConeGeometry(7.4, 3.6, 4), toy('#e53935'), 0, 6.8, 0, g); roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, .7);
      mesh(new RoundedBoxGeometry(1.8, 3, .3, 2, .1), toy('#8d6e63'), 0, 1.5, 3, g);
      for (const x of [-3, 3]) mesh(new RoundedBoxGeometry(1.6, 1.4, .3, 2, .1), toy('#81d4fa', { roughness: .1 }), x, 3, 3, g);
      const nameTex = canvasTex(512, 128, (c, w, h) => {
        c.fillStyle = '#1e88e5'; c.beginPath(); c.roundRect(0, 0, w, h, 40); c.fill();
        c.fillStyle = '#fff'; c.font = 'bold 64px "Arial Rounded MT Bold", Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('TOY TOWN', w / 2, h / 2 + 4);
      });
      const sign = mesh(new THREE.PlaneGeometry(5, 1.25), new THREE.MeshStandardMaterial({ map: nameTex, transparent: true, roughness: .5 }), 0, 4.4, 3.17, g, false);
    }

    // ================= cute cartoon trains =================
    // palettes listed in the same hue order as COLORS; train i gets style (4i+2)%9 so it never matches its own number colour
    const STYLES = [

    // ---------- people ----------

    // a face looking out of a train window (side = local x of the window)

    function makeTrain(i) {
      const st = styleOf(i);

      const wheels = [], cars = [], riders = [];
      // ---- engine: front (with face) at local +z ----
      const eng = new THREE.Group(), e = new THREE.Group(); eng.add(e);
      mesh(G.chassis, M.dark, 0, .85, 0, e);
      mesh(G.head, body, 0, 2.15, .95, e);
      mesh(G.cab, body, 0, 2.35, -1.15, e);
      mesh(G.cabRoof, roof, 0, 3.95, -1.15, e);
      for (const x of [-1.21, 1.21]) { const w = mesh(new RoundedBoxGeometry(.06, 1.0, 1.1, 2, .03), M.glass, x, 2.8, -1.1, e, false); }
      for (const x of [-1.21, 1.21]) windowFace(e, x, 2.72, -1.1, true);

    }
    const trains = [];
    for (let i = 0; i < N; i++) trains.push(makeTrain(i));

    // ---------- waiting passengers: each track has a little group on the platform beside it ----------
    const waiting = [];
    const PASS_Z = [-3.4, -2.1, .4];
    function spawnPassengers(i) {
      (waiting[i] || []).forEach(w => scene.remove(w.g));
      const n = 2 + (Math.random() < .5 ? 1 : 0);
      waiting[i] = [];
      for (let k = 0; k < n; k++) {
        const w = makePerson();
        w.home = new THREE.Vector3(xOf(i) - 2.05 + rnd(-.2, .2), PLAT_H, PASS_Z[k] + rnd(-.3, .3));

    function boardPassengers(tr) {
      waiting[tr.i].forEach((w, k) => {

    function revealRider(tr) {

    function updatePassengers(dt, time) {
      for (let i = 0; i < N; i++) {
        const tr = trains[i], excited = state === 'go' && follow === tr;

    function placeTrain(tr, time, dt) {
      const moving = !!tr.anim;
      if (!tr.inJourney) tr.cars.forEach((c, k) => {
        c.position.set(tr.x, RAIL_TOP, Z_START - (tr.s - k * CAR_GAP));

    // ================= steam puffs & confetti =================

    // ================= sound =================
    let actx = null, muted = false, noiseBuf = null;
    function tone(freq, dur, type = 'sine', vol = .2, delay = 0, slide = 0) {

      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .05);
    }
    const whistle = () => { tone(784, .45, 'sine', .14); tone(988, .45, 'sine', .11); tone(784, .7, 'sine', .14, .55); tone(988, .7, 'sine', .11, .55); };
    const ding = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .4, 'triangle', .2, k * .13));
    const oops = () => { tone(330, .25, 'triangle', .2, 0, -80); tone(250, .35, 'triangle', .2, .2, -60); };
    const boing = () => tone(300, .35, 'sine', .2, 0, 400);

    function speak(text) {

    const muteBtn = document.getElementById('mute');

    // ================= UI =================
    const pad = document.getElementById('pad');

    addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '9') choose(+e.key); });
    function showBubble(text, n) {

      bnum.textContent = n; bnum.style.background = COLORS[n - 1];
      bubbleEl.classList.remove('pop'); void bubbleEl.offsetWidth; bubbleEl.classList.add('pop');
    }

    // ================= game flow =================
    let state = 'idle', target = 0, lastTarget = 0, wrongs = 0, stars = 0, boardBounce = -1, follow = null;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const ASK = ['Take me to platform', 'Please go to platform', 'Which train goes to platform', 'Find platform'];

    function newRound() {
      do { target = 1 + Math.floor(Math.random() * N); } while (target === lastTarget);
      lastTarget = target; wrongs = 0; state = 'ask'; boardBounce = -1;
      const phrase = ASK[Math.floor(Math.random() * ASK.length)];
      showBubble(phrase, target);
      buttons.forEach(b => b.classList.remove('hint'));
      pad.classList.remove('off');
      speak(`${phrase} ${target}!`);
    }

    function choose(n) {
      if (state !== 'ask') return;
      const btn = buttons[n - 1], tr = trains[n - 1];
      if (n === target) {
        state = 'go'; pad.classList.add('off'); boardBounce = -1;
        buttons.forEach(b => b.classList.remove('hint'));
        highlight(tr.i, true); setSignal(tr.i, true);
        tr.lamp.material.emissiveIntensity = 3; tr.happy = 1.2; tr.hop = .6; boing();

    function updateJourney(dt, time) {
      const jn = journey, J = jn.J, tr = jn.tr;
      jn.t += dt;
      const f = Math.min(1, jn.t / jn.dur);
      const prog = f - Math.sin(2 * Math.PI * f) / (2 * Math.PI);     // one smooth lap, slow at start & end
      const ds = (prog - jn.prog) * J.len; jn.prog = prog;
      const uE = (.75 + prog) % 1;
      // train along the loop
      tr.cars.forEach((c, k) => {
        const u = (((uE - k * CAR_GAP / J.len) % 1) + 1) % 1;
        const p = J.curve.getPointAt(u), tg = J.curve.getTangentAt(u);
        const y = RAIL_TOP + Math.abs(Math.sin(time * 10 + k * 1.2)) * .08;
        c.position.set(p.x, y, p.z); c.lookAt(p.x + tg.x, y, p.z + tg.z);
      });
      tr.wheels.forEach(w => w.rotation.x -= ds / .5);
      if (ds > 0) { chuffT -= ds; if (chuffT <= 0) { chuff(.2); chuffT = 1.5; } }
      tr.puffT = Math.min(tr.puffT, ds / Math.max(dt, .001) > 2 ? .12 : 1);
      // chase camera from the outside of the loop
      const p = J.curve.getPointAt(uE), tg = J.curve.getTangentAt(uE);
      const out = jv.a.set(p.x, 0, p.z).normalize();
      const want = jv.b.copy(p).addScaledVector(out, 15).addScaledVector(tg, -9); want.y = 5;
      if (!jn.look) { camera.position.copy(want); jn.look = p.clone(); }
      camera.position.lerp(want, 1 - Math.pow(.15, dt));
      jn.look.lerp(jv.c.copy(p).addScaledVector(tg, 4).setY(3.6), 1 - Math.pow(.05, dt));
      camera.lookAt(jn.look);
      J.dome.position.copy(camera.position); J.stars.position.copy(camera.position);

      // ---- sun, moon, day & night ----
      const ang = f * Math.PI * 2 + .35, elev = Math.sin(ang);
      const duskK = sm(-.3, .05, elev), dayK = sm(0, .4, elev), nightK = 1 - sm(-.25, .08, elev);
      J.skyU.top.value.copy(NIGHT_TOP).lerp(DUSK_TOP, duskK).lerp(new THREE.Color(J.D.top), dayK);
      J.skyU.bottom.value.copy(NIGHT_BOT).lerp(DUSK_BOT, duskK).lerp(new THREE.Color(J.D.bot), dayK);
      J.scene.fog.color.copy(J.skyU.bottom.value);
      camera.getWorldDirection(jv.fwd); jv.fwd.y = 0; jv.fwd.normalize();
      jv.right.crossVectors(jv.fwd, jv.up).normalize();
      const place = (obj, a) => {
        obj.position.copy(camera.position).addScaledVector(jv.fwd, 600).addScaledVector(jv.right, -Math.cos(a) * 320);
        obj.position.y = Math.sin(a) * 125 - 6; obj.visible = Math.sin(a) > -.15;
      };
      place(J.sun, ang); place(J.moon, ang + Math.PI);
      J.stars.material.opacity = nightK;
      // lighting follows whichever is in the sky
      const sunUp = elev > 0, src = sunUp ? J.sun : J.moon;
      const dir = jv.a.copy(src.position).sub(camera.position).normalize(); dir.y = Math.max(dir.y, .25); dir.normalize();
      J.light.position.copy(tr.cars[0].position).addScaledVector(dir, 90);
      J.light.target.position.copy(tr.cars[0].position);
      J.light.intensity = sunUp ? .4 + 2.2 * sm(0, .35, elev) : .55 * sm(0, .3, -elev);
      J.light.color.set(sunUp ? (elev < .3 ? '#ffb070' : '#fff3dd') : '#9fb4ff');
      J.hemi.intensity = .25 + .75 * dayK;
      J.hemi.color.copy(J.skyU.top.value).lerp(new THREE.Color('#ffffff'), .5);
      tr.lamp.material.emissiveIntensity = .4 + nightK * 4;
      J.night.forEach(fn => fn(nightK));
      J.update.forEach(fn => fn(dt, time));

      // ---- little narration ----
      if (!jn.saidDusk && f > .3 && elev < .3) { jn.saidDusk = true; showBubble('🌇 The sun is going down…', tr.i + 1); speak('Look! The sun is going down.'); }
      if (!jn.saidNight && elev < -.1) { jn.saidNight = true; showBubble('🌙 Good night! Moon and stars!', tr.i + 1); speak('Good night! Look at the moon and the stars!'); }
      if (jn.saidNight && !jn.saidMorning && f > .9 && elev > 0) { jn.saidMorning = true; showBubble('☀️ Good morning, sun!', tr.i + 1); speak('Good morning! Here comes the sun!'); }
      if (f >= 1 && !jn.ending) { jn.ending = true; endJourney(); }
    }

    // ================= loop =================
    const clock = new THREE.Clock();
    let chuffT = 0;
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
      for (const tr of trains) {
        let speed = 0;
        if (tr.anim) {
          const a = tr.anim;
          if (a.delay > 0) a.delay -= dt;
          else {
            a.t += dt / a.dur;
            const prev = tr.s;
            tr.s = a.from + (a.to - a.from) * ease(Math.min(1, a.t));
            const ds = tr.s - prev;
            speed = Math.abs(ds) / dt;
            tr.wheels.forEach(w => w.rotation.x -= ds / .5);
            if (speed > .5) { chuffT -= dt * speed; if (chuffT <= 0) { chuff(.22); chuffT = 1.5; } }
            if (a.t >= 1) { tr.anim = null; a.done(); }
          }
        }
        tr.wobble = Math.max(0, tr.wobble - dt);
        placeTrain(tr, time, dt);
        tr.puffT -= dt;
        if (tr.puffT <= 0) { if (!journey || tr.inJourney) spawnPuff(tr); tr.puffT = speed > .5 ? Math.max(.08, .6 / speed) : rnd(1.5, 3); }
      }
      updatePassengers(dt, time);
      puffs.forEach(p => {
        if (p.life <= 0) return;
        p.life -= dt; p.m.position.addScaledVector(p.v, dt);
        const a = p.life / 1.8; p.m.material.opacity = a * .9; p.m.scale.setScalar(.3 + (1 - a) * 1.1);
        if (p.life <= 0) p.m.visible = false;
      });

      if (journey) updateJourney(dt, time);
      else {
      // camera: drifts gently; follows the chosen train and swings low to see its face
      let fk = 0;
      if (follow) {
        fk = THREE.MathUtils.clamp((follow.s - S0) / (S_END - S0), 0, 1);
        camGoal.set(follow.x * .7, 1.5, Z_START - follow.s + 5);
      } else camGoal.copy(camBase);
      camLook.lerp(camGoal, 1 - Math.pow(.3, dt));
      camDirGoal.copy(camDirBase).lerp(camDirFollow, fk).normalize();
      camDir.lerp(camDirGoal, 1 - Math.pow(.3, dt)).normalize();
      camera.position.copy(camLook).addScaledVector(camDir, camDist * (1 - .35 * fk));
      camera.position.x += Math.sin(time * .15) * 2;
      camera.lookAt(camLook);
      }

      confetti.forEach(c => {
        if (c.life <= 0) return;
        c.life -= dt; c.v.y -= 14 * dt; c.v.multiplyScalar(.985);
        c.m.position.addScaledVector(c.v, dt);
        c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
        if (c.life <= 0 || c.m.position.y < 0) { c.life = 0; c.m.visible = false; }
      });
      clouds.forEach((c, k) => { c.position.x += dt * (.6 + k * .1); if (c.position.x > 110) c.position.x = -110; });

      boards.forEach((b, i) => {
        const on = i === boardBounce && (state === 'arrived' || state === 'ask');
        const k = on ? Math.abs(Math.sin(time * 6)) : 0;
        b.scale.setScalar(1 + k * .18); b.position.y = BOARD_Y - .75 - k * .25;
      });

      renderer.render(journey ? journey.J.scene : scene, camera);
    });
  </script>
</body>
